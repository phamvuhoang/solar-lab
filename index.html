  <style>body{font:16px system-ui,sans-serif;margin:0 auto;max-width:48rem;padding:1rem 16px}button,input,select,textarea{font:inherit;margin:.25rem}.finding{display:block;text-align:left;width:100%}.finding.fail{border-left:6px solid #c0392b}.finding.limited{border-left:6px dashed #d68910}.finding.unknown{border-left:6px dotted #777}.node:focus,.port:focus{outline:3px solid #2874a6}.node,.port{cursor:pointer}tr.selected,tr[aria-selected=true]{background:#fef08a}table{border-collapse:collapse}.panel:focus{outline:3px solid #2874a6}td,th{padding:.2rem .5rem;text-align:left}.num{text-align:right}.report-page{border:1px solid #8886;padding:12px;margin-top:8px}.report-page table{width:100%;font-size:.9rem}.report-page th,.report-page td{border-bottom:1px solid #8884;vertical-align:top}@page{size:A4;margin:14mm}@media print{body{max-width:none;padding:0;font-size:11pt}#app>*:not(.report-page),footer{display:none!important}.report-page{border:0;padding:0;margin:0}.report-page section,.report-page table{break-inside:avoid}.report-page svg{max-width:100%}}</style>
